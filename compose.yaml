services:
  db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_DB: alfa_insight
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-contest-only}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa_insight"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://alfa:${POSTGRES_PASSWORD:-local-contest-only}@db:5432/alfa_insight
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_TOKEN: ${DEMO_TOKEN:-alfa-local-demo}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-alfa-local-admin}
      LLM_MODE: ${LLM_MODE:-disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_APPROVED_NAME: ${LLM_APPROVED_NAME:-}
      LLM_PROTOCOL: ${LLM_PROTOCOL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1800}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-35}
      LLM_DAILY_BUDGET_RUB: ${LLM_DAILY_BUDGET_RUB:-500}
      LLM_INPUT_RUB_PER_MILLION: ${LLM_INPUT_RUB_PER_MILLION:-0}
      LLM_OUTPUT_RUB_PER_MILLION: ${LLM_OUTPUT_RUB_PER_MILLION:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/private:/app/data/private:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata:
