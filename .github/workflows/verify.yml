name: Verify submission
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.8-bookworm
        env:
          POSTGRES_DB: alfa_insight
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U alfa -d alfa_insight" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://alfa:ci-only@127.0.0.1:5432/alfa_insight
      PYTHONPATH: backend
      LLM_MODE: disabled
      SKIP_OFFICIAL_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/tests -q --junitxml=pytest.xml
      - run: npm install --global pnpm@11.25.0
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/insight-server.log 2>&1 &
      - run: curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/api/health
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: pnpm --dir frontend test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            pytest.xml
            runtime/playwright-results.json
            frontend/test-results

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_PORT: "18081"
      ADMIN_TOKEN: ci-container-admin-only
      POSTGRES_PASSWORD: ci-container-only
      LLM_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - name: Build and start clean Docker stack
        run: docker compose -p alfa-ci up --build --wait --wait-timeout 180
      - name: Verify HTTP workflow and access boundaries
        run: python scripts/container_smoke.py --url http://127.0.0.1:18081
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p runtime
          docker compose -p alfa-ci logs --no-color > runtime/docker-ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-verification
          path: runtime/docker-ci.log
      - name: Stop isolated test stack
        if: always()
        run: docker compose -p alfa-ci down -v
